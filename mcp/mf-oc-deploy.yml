apiVersion: v1
kind: ConfigMap
metadata: { name: __APP__, namespace: __NAMESPACE__ }
data:
  PORT: "4854"
  DESIGNER_BIND_HOST: "0.0.0.0"
  DESIGNER_ALLOWED_ORIGINS: "https://__DESIGNER_HOST__"
  DESIGNER_RENDER_URL: "https://__DESIGNER_HOST__"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: __APP__, namespace: __NAMESPACE__ }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: __APP__ } }
  template:
    metadata: { labels: { app: __APP__ } }
    spec:
      containers:
        - name: mcp
          image: __IMAGE__
          ports: [{ name: http, containerPort: 4854 }]
          envFrom: [{ configMapRef: { name: __APP__ } }]
          readinessProbe:
            httpGet: { path: /health, port: http }
---
apiVersion: v1
kind: Service
metadata: { name: __APP__, namespace: __NAMESPACE__ }
spec:
  selector: { app: __APP__ }
  ports: [{ name: http, port: 4854, targetPort: http }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: __APP__, namespace: __NAMESPACE__ }
spec:
  host: __MCP_HOST__
  to: { kind: Service, name: __APP__ }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }

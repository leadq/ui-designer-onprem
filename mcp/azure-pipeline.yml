trigger:
  - __RELEASE_BRANCH__
pool:
  name: __BUILD_POOL__
steps:
  - checkout: self
  - bash: |
      set -eu
      image="$IMAGE_REPOSITORY:$BUILD_SOURCEVERSION-$BUILD_BUILDID"
      args=()
      if [[ -n "${NPM_CONFIG_USERCONFIG:-}" ]]; then args+=(--secret "id=npmrc,src=$NPM_CONFIG_USERCONFIG"); fi
      DOCKER_BUILDKIT=1 docker build "${args[@]}" --build-arg "NODE_IMAGE=$NODE_IMAGE" -t "$image" .
      docker push "$image"
      sed "s|__IMAGE__|$image|g" mf-oc-deploy.yml > "$BUILD_ARTIFACTSTAGINGDIRECTORY/mf-oc-deploy.yml"
    env:
      IMAGE_REPOSITORY: __REGISTRY_IMAGE_PATH__
      NODE_IMAGE: __APPROVED_NODE_IMAGE__
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: drop
